name: Build and Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.2.0) - leave empty to use package.json version'
        required: false
      draft:
        description: 'Create as draft release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  create-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag-name: ${{ steps.version.outputs.TAG }}
      upload-url: ${{ steps.create.outputs.upload_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          # 获取当前 package.json 版本
          CURRENT_VER=$(node -p "require('./package.json').version")

          if [ -n "${{ inputs.version }}" ]; then
            # 用户指定了版本
            TAG="v${{ inputs.version }}"
            NEED_COMMIT=false
          else
            # 自动递增版本号（minor 版本）
            # 例如 0.1.0 -> 0.2.0, 1.5.3 -> 1.6.0
            MAJOR=$(echo $CURRENT_VER | cut -d. -f1)
            MINOR=$(echo $CURRENT_VER | cut -d. -f2)
            PATCH=$(echo $CURRENT_VER | cut -d. -f3)
            NEW_MINOR=$((MINOR + 1))
            NEW_VER="${MAJOR}.${NEW_MINOR}.0"
            TAG="v${NEW_VER}"

            # 更新 package.json
            node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.version='${NEW_VER}';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

            echo "Auto incrementing version: $CURRENT_VER -> ${NEW_VER}"
            NEED_COMMIT=true
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "NEED_COMMIT=$NEED_COMMIT" >> $GITHUB_OUTPUT

      - name: Commit version bump
        if: steps.version.outputs.NEED_COMMIT == 'true'
        run: |
          TAG="${{ steps.version.outputs.TAG }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to ${TAG}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Fetch existing tags
          git fetch --tags
          # Check if tag already exists on remote
          TAG="${{ steps.version.outputs.TAG }}"
          if git tag -l | grep -q "^${TAG}$"; then
            echo "Tag ${TAG} already exists, skipping creation"
          else
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: ${{ steps.version.outputs.TAG }}
          draft: ${{ inputs.draft }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: [create-release]
    if: always() && (needs.create-release.result == 'success' || github.event_name == 'release')
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact: win
          - os: macos-latest
            platform: mac
            artifact: mac
          - os: ubuntu-latest
            platform: linux
            artifact: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get tag name
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            echo "TAG=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${{ needs.create-release.outputs.tag-name }}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm run rebuild

      - name: Build app
        run: npm run build

      - name: Build electron app (${{ matrix.platform }})
        run: npm run build:${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-build/*
          retention-days: 1

  release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success'

    steps:
      - name: Get tag name
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            echo "TAG=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${{ needs.create-release.outputs.tag-name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: win
          path: dist-build/win

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac
          path: dist-build/mac

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist-build/linux

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          files: |
            dist-build/win/*
            dist-build/mac/*
            dist-build/linux/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}