<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude GUI</title>
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('theme-store');
          console.log('[anti-fouc] localStorage theme-store:', raw);
          if (raw) {
            var state = JSON.parse(raw).state;
            console.log('[anti-fouc] parsed state:', state);
            if (state && state.theme === 'light') {
              document.documentElement.setAttribute('data-theme', 'light');
            } else if (state && state.theme === 'dark') {
              document.documentElement.setAttribute('data-theme', 'dark');
            } else {
              var mq = window.matchMedia('(prefers-color-scheme: dark)');
              document.documentElement.setAttribute('data-theme', mq.matches ? 'dark' : 'light');
            }
          } else {
            var mq = window.matchMedia('(prefers-color-scheme: dark)');
            document.documentElement.setAttribute('data-theme', mq.matches ? 'dark' : 'light');
          }
        } catch(e) { console.error('[anti-fouc] error:', e); }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
