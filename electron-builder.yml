appId: com.fengclaude.app
productName: Feng Claude
directories:
  buildResources: resources
  output: dist-build
files:
  - out/**/*
  - scripts/browser-mcp-server.js
  - scripts/pty-daemon.js
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
asarUnpack:
  - resources/**
  - node_modules/node-pty/**
# [2026-07-31] 在生成 DMG/ZIP 前为未签名的 macOS App 补完整 ad-hoc 签名，
# 保证 Gatekeeper 能校验包完整性并允许用户从「隐私与安全性」手动放行。
afterPack: scripts/after-pack.cjs
win:
  executableName: feng-claude
  forceCodeSigning: false
  target:
    - nsis
nsis:
  artifactName: '${name}-${version}-setup.${ext}'
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  shortcutName: '${productName}'
  uninstallDisplayName: '${productName}'
  createDesktopShortcut: always
mac:
  # [2026-08-31] 仅支持 Apple Silicon；不再构建 Intel (x64) 包。
  # [2026-07-09] 自动更新需要 zip 格式（electron-updater 不支持 dmg 更新）
  # [2026-07-31] 使用无空格的固定产物名，确保 latest-mac.yml URL 与 GitHub asset 完全一致
  artifactName: '${name}-${version}-${arch}.${ext}'
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  # 无 Developer ID 分发：afterPack 会补 ad-hoc 签名；首次启动仍需在「隐私与安全性」点「仍要打开」
  identity: null
# Auto update configuration
publish:
  - provider: github
    owner: FenGsHt
    repo: feng-claude
