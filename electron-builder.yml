appId: com.fengclaude.app
productName: Feng Claude
directories:
  buildResources: resources
  output: dist-build
files:
  - out/**/*
  - scripts/browser-mcp-server.js
  - scripts/pty-daemon.js
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
asarUnpack:
  - resources/**
  - node_modules/node-pty/**
win:
  executableName: feng-claude
  forceCodeSigning: false
  target:
    - nsis
    - portable
portable:
  artifactName: '${name}-${version}-portable.${ext}'
nsis:
  artifactName: '${name}-${version}-setup.${ext}'
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  shortcutName: '${productName}'
  uninstallDisplayName: '${productName}'
  createDesktopShortcut: always
mac:
  # [2026-06-09] 同时构建 Apple Silicon (arm64) 与 Intel (x64)，否则默认仅出 runner 架构包
  # [2026-07-09] 自动更新需要 zip 格式（electron-updater 不支持 dmg 更新）
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  # 未签名分发：Gatekeeper 仍会拦，用户需「右键打开」或 `xattr -cr <App>`
  identity: null
linux:
  target:
    - AppImage

# Auto update configuration
publish:
  - provider: github
    owner: FenGsHt
    repo: feng-claude
